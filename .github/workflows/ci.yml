# Plan: Milestone 12 | CI / Final Verification
# Validates type safety, deterministic tests, and build integrity on every PR.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, Coverage, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repository diagnostics
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "HEAD=$(git rev-parse HEAD)"
          git status --short
          grep -A10 '"devDependencies"' package.json        

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"

      - name: Install dependencies
        run: npm ci
      
      - name: Verify test environment
        run: |
          node --version
          npm --version
          npm ls vitest
          npm ls @vitest/coverage-v8          
      
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Offline tests and 100% coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Verify curated submission evidence
        run: node scripts/verify-submission-evidence.mjs
